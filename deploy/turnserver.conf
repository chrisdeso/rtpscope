# turnserver.conf --> coturn: stun + turn relay on 3478, logins are minted by server.py
# setup.sh swaps __DOMAIN__ / __TURN_SECRET__ and copies this to /etc/turnserver.conf
listening-port=3478
realm=__DOMAIN__
fingerprint
use-auth-secret
static-auth-secret=__TURN_SECRET__

# relay ports --> has to match the firewall in setup.sh
min-port=49160
max-port=49260

# plain 3478 udp/tcp covers most networks, no turns:// for now (no cert --> no tls/dtls listeners)
no-tls
no-cli
no-multicast-peers

# don't let the relay be used to reach private / internal addresses
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

syslog
simple-log
